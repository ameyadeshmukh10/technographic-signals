[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technographics"
version = "0.1.0"
description = "Dual-pipeline (DNS + JS/Web) technographic vendor detection with a shared signature library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Technographic Signals" }]
dependencies = [
    "dnspython>=2.4.0",
    "aiodns>=3.1.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
web = ["playwright>=1.40.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
technographics = "technographics.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
technographics = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
